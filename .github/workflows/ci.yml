name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate tap layout
        run: |
          set -euo pipefail
          test -d Casks
          test -d Formula
      - name: Audit formulae and casks
        run: |
          set -euo pipefail
          files=()
          for file in Formula/*.rb Casks/*.rb; do
            [ -e "$file" ] && files+=("$file")
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No formulae or casks to audit yet."
            exit 0
          fi

          brew update --quiet
          brew style "${files[@]}"
          # Path-based `brew audit` is disabled by modern Homebrew ("Use `brew audit
          # [name ...]`"), so expose this checkout AS the tap and audit by name.
          taps_dir="$(brew --repository)/Library/Taps/thenvoi"
          mkdir -p "$taps_dir"
          ln -sfn "$GITHUB_WORKSPACE" "$taps_dir/homebrew-tap"
          # --except: two findings are BY DESIGN for our dist-generated, closed-source
          # formula — `version` (dist always writes an explicit version, which audit
          # calls redundant with the URL) and `license` (LicenseRef-Proprietary is
          # valid SPDX syntax but not on brew's allow-list). Everything else stays strict.
          for file in Formula/*.rb; do
            [ -e "$file" ] || continue
            brew audit --strict --except=version,license --formula "thenvoi/tap/$(basename "$file" .rb)"
          done
          for file in Casks/*.rb; do
            [ -e "$file" ] || continue
            brew audit --strict --cask "thenvoi/tap/$(basename "$file" .rb)"
          done
